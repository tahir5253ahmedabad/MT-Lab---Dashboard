<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Warranty & KPI Dashboard – MT Lab (auto-updating)</title>
<style>
:root{--bg:#0a0d18;--tx:#eef0ff;--mu:#a3a9d0;--bd:rgba(255,255,255,.12);--blue:#5da2ff;--grn:#2ee6c0;--or:#ffc266;--red:#ff7b8a;--pur:#a48bff;--glass:rgba(125,145,255,.13);--edge:rgba(255,255,255,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.45 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(900px 520px at 6% -4%,rgba(110,80,255,.55),rgba(110,80,255,0) 62%),radial-gradient(820px 520px at 100% 2%,rgba(20,184,160,.40),rgba(20,184,160,0) 58%),radial-gradient(900px 640px at 72% 100%,rgba(255,110,90,.28),rgba(255,110,90,0) 62%),var(--bg);background-attachment:fixed}
.w{max-width:1180px;margin:0 auto;padding:36px 20px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}.sub{margin-top:6px;font-size:13px;color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--grn);margin-right:9px}.sub.off .dot{background:var(--or)}
button{font:inherit;color:var(--tx);cursor:pointer}
.card,#rf,.pill,.big{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--edge)}
.card{border-radius:24px;padding:24px;box-shadow:0 14px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14)}
#rf{display:none;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:500}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.lab{font-size:11px;font-weight:600;letter-spacing:.09em;color:var(--mu);width:74px;flex:none}
.pill{padding:7px 16px;border-radius:999px;font-size:13px}
.pill.on{background:var(--tx);border-color:var(--tx);color:#0a0d18;font-weight:600}
.big{display:inline-flex;width:fit-content;max-width:100%;overflow-x:auto;gap:4px;padding:5px;margin-top:26px;border-radius:999px}
.big .pill{-webkit-backdrop-filter:none;backdrop-filter:none;border:0;background:transparent;padding:10px 20px;font-size:14px;color:#c9cdee;white-space:nowrap}
.big .pill.on{background:linear-gradient(135deg,#7a6bff,#5b8cff);color:#fff;box-shadow:0 6px 16px rgba(110,100,255,.4)}
#rf{background:rgba(46,230,192,.12);border-color:rgba(46,230,192,.38)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:24px 0 14px}
.k{padding:20px;background:rgba(120,140,255,.10)}.k b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}.k span{display:block;margin-top:6px;color:var(--mu);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.kp .k:last-child{background:linear-gradient(135deg,rgba(122,107,255,.42),rgba(91,140,255,.26))}.kp .k:last-child b{font-size:24px;line-height:36px;margin-bottom:0}.kp .k:last-child span{margin-top:0}
.sp{background:rgba(46,230,192,.16);color:#5df0d0;padding:4px 12px;border-radius:99px;font-weight:600}
.card h2{font-size:11px;font-weight:600;margin:0 0 18px;color:var(--mu);text-transform:uppercase;letter-spacing:.09em}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.br{display:flex;align-items:center;gap:12px;margin:13px 0}.br>span{width:64px;flex:none;font-size:14px}.bw{flex:1}
.br em{font-style:normal;color:var(--mu);font-size:13px;min-width:46px;text-align:right}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}.bar i{display:block;min-width:0}
.trk{height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}.trk i{display:block;height:100%;border-radius:99px}
.lg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:12px}.lg u{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;text-decoration:none}
.mb{margin:10px 0 16px}.mb b{font-size:13px}.sm{margin:6px 0}.sm>span{width:96px!important;font-size:12px!important}
.tw{overflow-x:auto;margin-bottom:14px}table{border-collapse:collapse;width:100%;min-width:520px}
th{font-weight:500;color:var(--mu);font-size:12px;text-align:right;padding:10px 12px;white-space:nowrap;cursor:pointer;user-select:none}
td{padding:15px 12px;text-align:right;border-top:1px solid rgba(255,255,255,.09);white-space:nowrap}
th:first-child,td:first-child{text-align:left}td:first-child{font-weight:600}
.note{color:var(--mu);font-size:12px;margin-top:6px}
#tip{position:fixed;z-index:9;pointer-events:none;background:rgba(10,13,24,.94);border:1px solid var(--edge);color:#eef0ff;font-size:12px;padding:7px 11px;border-radius:10px;max-width:240px;display:none}
[data-tip],.lg span,.pl div{cursor:pointer}.card.hl [data-l]{opacity:.3}.card.hl [data-l].act{opacity:1}[data-l]{transition:opacity .15s}
.nm{cursor:pointer}.nm:hover{color:var(--blue)}
.pw{display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center}.rel{position:relative;width:190px;height:190px;flex:none}.rel svg{width:100%;height:100%}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}.ctr b{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.ctr span{font-size:12px;color:var(--mu);max-width:96px}
circle[data-l]{transition:stroke-width .15s,opacity .15s}circle.act{stroke-width:28}
.pl{flex:1;min-width:170px}.pl div{display:flex;align-items:center;gap:8px;padding:6px 0}.pl u{width:10px;height:10px;border-radius:50%;flex:none}.pl em{margin-left:auto;font-style:normal;color:var(--mu)}
.ax{fill:var(--mu);font-size:10px}
@media(max-width:520px){.kp .k:last-child{grid-column:1/-1}h1{font-size:23px}}
</style></head><body><div class="w">
<header><div><h1>Warranty & KPI Dashboard</h1><div class="sub" id="sub"><i class="dot"></i>MT Lab · <span id="stat">Connecting to Google Sheets…</span></div></div><button id="rf">↻ Refresh</button></header>
<div class="row big" id="tabs"></div>
<div class="row"><div class="lab">EMPLOYEE</div><div class="row" style="margin:0" id="ep"></div></div>
<div class="kp" id="kp"></div>
<div class="g"><div class="card"><h2 id="t1"></h2><div id="c1"></div><div class="lg" id="l1"></div></div>
<div class="card"><h2 id="t2"></h2><div id="c2"></div><div class="lg" id="l2"></div></div></div>
<div class="g" id="more"></div>
<div class="card tw"><h2 id="t4"></h2><table id="t"></table></div>
<div class="note" id="nt">Every figure is read from the Dashboard tab of your Google Sheet. Open this page from its claude.ai link with the Google Sheets connector.</div>
</div><div id="tip"></div>
<script>
let DASH=null,tab="warranty",emp="All",sk="k",asc=true,LOADED=false;
const $=id=>document.getElementById(id);
const T=v=>String(v==null?"":v).trim(),U=v=>T(v).toUpperCase();
const num=v=>{const x=parseFloat(String(v).replace(/[%,]/g,""));return isNaN(x)?null:x};
const r1=x=>Math.round(x*10)/10,mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const ST=[["Pending","var(--or)"],["Out for repair","var(--red)"],["Searching parts","var(--pur)"],["Awaiting Delivery","var(--blue)"],["Delivered","var(--grn)"]];
const NAMES={warranty:"Warranty",pending:"Pending stock",stock:"Stock checking",cum:"Cumulative"};
const COLS={
warranty:[["n","Employee"],["a","Assigned"],["c","Delivered"],["o","Open"],["r","Completion"],["avg","Avg close"],["ot","On-time"],["pd","Avg pending"],["s","Score"],["k","Rank"]],
pending:[["n","Employee"],["a","Assigned"],["c","Completed"],["o","Pending"],["r","Completion"],["avg","Avg close"],["s","Score"],["k","Rank"]],
stock:[["n","Employee"],["a","Assigned"],["c","Completed"],["o","Pending"],["r","Completion"],["s","Score"],["k","Rank"]],
cum:[["n","Employee"],["w","Warranty score"],["p","Pending stock score"],["st","Stock checking score"],["s","Overall score"],["k","Rank"]]};
const PCT=new Set(["r","ot","s","w","p","st"]);
function parseDash(v){const g=(r,c)=>T((v[r]||[])[c]),n0=x=>num(x)||0;
const find=(row,lab,from,to)=>{const a=v[row]||[];for(let i=from||0;i<(to||a.length);i++)if(U(a[i])===lab)return i;return -1};
const rowsWith=lab=>v.map((a,i)=>(a||[]).some(c=>U(c)===lab)?i:-1).filter(i=>i>=0);
const kr=rowsWith("TOTAL ASSIGNED"),hr=rowsWith("EMPLOYEE");if(kr.length<2||hr.length<2)throw new Error("layout");
const kv=(row,lab,from,to)=>{const i=find(row,lab,from,to);return i<0?"":g(row+1,i)};
const idx=(row,lab)=>(v[row]||[]).map((c,i)=>U(c)===lab?i:-1).filter(i=>i>=0);
const split=idx(kr[1],"TOTAL ASSIGNED")[1]||999,split2=idx(hr[1],"EMPLOYEE")[1]||999;
const kp=(row,from,to,w)=>({a:n0(kv(row,"TOTAL ASSIGNED",from,to)),aw:w?n0(kv(row,"AWAITING FOR DELIVERY",from,to)):null,c:n0(kv(row,w?"DELIVERED":"COMPLETED",from,to)),o:n0(kv(row,"CURRENTLY OPEN",from,to)),rate:kv(row,"COMPLETION RATE",from,to),top:kv(row,"TOP PERFORMER",from,to)});
const table=(row,from,to,cols)=>{const ix={};cols.forEach(([k,l])=>{ix[k]=find(row,l,from,to)});const out=[];for(let r=row+1;r<v.length;r++){const nm=g(r,ix.n);if(!nm)break;const o={};for(const k in ix)o[k]=k==="n"?nm:n0(g(r,ix[k]));out.push(o)}return out};
const W=table(hr[0],0,999,[["n","EMPLOYEE"],["a","T. ASSIG"],["p","PENDING"],["f","OUT FOR REPAIR"],["g","SEARCHING PARTS"],["aw","AWAITING DELIVERY"],["c","DELIVERED"],["o","CURRENTLY OPEN"],["r","COMPLETION"],["avg","AVG CLOSING DAYS"],["ot","ON-TIME COMPLETION"],["pd","AVG PENDING DAYS"],["s","OVERALL SCORE"],["k","RANK"]]).map(x=>Object.assign(x,{st:[x.p,x.f,x.g,x.aw,x.c]}));
const P=table(hr[1],0,split2,[["n","EMPLOYEE"],["a","T. ASSIG"],["c","COMPLETED"],["o","PENDING"],["r","COMPLETION"],["avg","AVG CLOSING DAYS"],["s","OVERALL SCORE"],["k","RANK"]]);
const S=table(hr[1],split2,999,[["n","EMPLOYEE"],["a","T. ASSIG"],["c","COMPLETED"],["o","PENDING"],["s","OVERALL SCORE"],["k","RANK"]]).map(x=>Object.assign(x,{r:x.s}));
if(!W.length||!P.length||!S.length)throw new Error("layout");
return{warranty:{kpi:kp(kr[0],0,999,true),rows:W},pending:{kpi:kp(kr[1],0,split,false),rows:P},stock:{kpi:kp(kr[1],split,999,false),rows:S}}}
const rowsFor=t=>DASH&&DASH[t]?DASH[t].rows.map(x=>Object.assign({},x)):[];
const rank=rows=>{rows.forEach(x=>{x.k=1+rows.filter(y=>y.s>x.s).length});return rows};
function emps(){const o=[];if(DASH)for(const t in DASH)DASH[t].rows.forEach(r=>{if(!o.includes(r.n))o.push(r.n)});return o}
function cumRows(){const P={};for(const t in NAMES)if(t!=="cum")P[t]=rowsFor(t);
return rank(emps().map(e=>{const f=t=>{const r=P[t].find(x=>x.n===e);return r?r.s:0},w=f("warranty"),p=f("pending"),st=f("stock");return{n:e,w:w,p:p,st:st,s:r1((w+p+st)/3)}}))}
const topName=rows=>{const ks=rows.filter(x=>x.k>0).map(x=>x.k);if(!ks.length)return"–";const m=Math.min(...ks);return rows.filter(x=>x.k===m).map(x=>x.n).join(" & ")};
const fmt=(c,v)=>c==="k"?(v===1?"🏆 1":v>0?v:"–"):v==null?"–":PCT.has(c)?v+"%":v;
const pill=(t,on,fn)=>{const b=document.createElement("button");b.className="pill"+(on?" on":"");b.textContent=t;b.onclick=fn;return b};
const lg=a=>a.map(x=>`<span data-l="${x[0]}"><u style="background:${x[1]}"></u>${x[0]}</span>`).join("");
const nm=n=>`<span class="nm" data-e="${n}" title="Tap to filter to ${n}">${n}</span>`;
const card=(t,b,l)=>`<div class="card"><h2>${t}</h2>${b}${l?`<div class="lg">${l}</div>`:""}</div>`;
const trk=(x,f,l,c,u,mx)=>`<div class="trk"><i data-l="${l}" data-tip="${x.n} · ${l}: ${x[f]}${u}" style="width:${Math.min(100,(x[f]||0)/mx*100)}%;background:${c}"></i></div>`;
const grp=(R,ser,mx)=>R.map(x=>`<div class="mb"><b>${nm(x.n)}</b>${ser.map(([f,l,c,u])=>`<div class="br sm"><span>${l}</span><div class="bw">${trk(x,f,l,c,u,mx)}</div><em>${x[f]}${u}</em></div>`).join("")}</div>`).join("");
const stk=(R,segf,mx,end)=>R.map(x=>{const sg=segf(x),tot=sg.reduce((a,s)=>a+s[0],0);return`<div class="br"><span>${nm(x.n)}</span><div class="bw"><div class="bar" style="width:${Math.min(100,tot/mx*100)}%">${sg.map(s=>`<i data-l="${s[2]}" data-tip="${x.n} · ${s[2]}: ${r1(s[0])}" style="flex:${s[0]};background:${s[1]}"></i>`).join("")}</div></div><em>${end(x)}</em></div>`}).join("");
function pie(S,unit){const Tt=S.reduce((a,x)=>a+x.v,0),Cc=2*Math.PI*56;let c=0;
return`<div class="pw"><div class="rel"><svg viewBox="0 0 160 160">${S.filter(x=>x.v>0).map(x=>{const f=x.v/Tt,len=f*Cc,o=-c*Cc;c+=f;return`<circle data-l="${x.l}" data-n="${x.v}" data-p="${r1(f*100)}" data-tip="${x.l}: ${x.v} (${r1(f*100)}%)" cx="80" cy="80" r="56" fill="none" stroke="${x.c}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${len} ${Cc}" stroke-dashoffset="${o}" transform="rotate(-90 80 80)"/>`}).join("")}</svg><div class="ctr"><b class="cb" data-t="${Tt}">${Tt}</b><span class="cl" data-u="${unit}">${unit}</span></div></div><div class="pl">${S.map(x=>`<div data-l="${x.l}" data-n="${x.v}" data-p="${Tt?r1(x.v/Tt*100):0}"><u style="background:${x.c}"></u>${x.l}<em>${x.v}</em></div>`).join("")}</div></div>`}
function render(){
const cum=tab==="cum",rows=DASH?(cum?cumRows():rowsFor(tab)):[];
if(emp!=="All"&&!rows.some(x=>x.n===emp))emp="All";
const R=rows.filter(x=>emp==="All"||x.n===emp);
$("tabs").replaceChildren(...Object.keys(NAMES).map(k=>pill(NAMES[k],k===tab,()=>{tab=k;sk="k";asc=true;render()})));
$("ep").replaceChildren(...["All",...emps().sort()].map(n=>pill(n,n===emp,()=>{emp=n;render()})));
if(!rows.length){["c1","l1","c2","l2","more","t","t1","t2","t4"].forEach(i=>$(i).innerHTML="");$("kp").innerHTML='<div class="card" style="grid-column:1/-1;color:var(--mu)">'+(LOADED?"Couldn’t find any employees in the Dashboard tab.":"No data yet. This page needs the Google Sheets connector to load data.")+'</div>';return}
const col={};emps().forEach((e,i)=>{col[e]=["var(--blue)","var(--or)","var(--grn)","var(--pur)"][i%4]});
const A=R.reduce((a,x)=>a+x.a,0),C=R.reduce((a,x)=>a+x.c,0),O=R.reduce((a,x)=>a+x.o,0),AW=R.reduce((a,x)=>a+(x.aw||0),0);
const kd=(emp==="All"&&!cum)?DASH[tab].kpi:null,top=kd?(kd.a>0&&kd.top?kd.top:"–"):topName(R),tl=emp==="All"?"Top performer":"Rank "+fmt("k",R[0].k);
const pc=kd&&kd.rate?kd.rate:(R.length===1&&!cum?R[0].r:(A?r1(C/A*100):0))+"%",av=f=>r1(mean(R.map(y=>y[f])))+"%";
const kp=cum?[[av("w"),"Warranty score"],[av("p"),"Pending stock score"],[av("st"),"Stock checking score"],[av("s"),"Overall score"],[top,tl]]
:tab==="warranty"?[[kd?kd.a:A,"Total assigned"],[kd?kd.c:C,"Delivered"],[kd?kd.o:O,"Currently open"],[kd?kd.aw:AW,"Awaiting delivery"],[pc,"Completion rate"],[top,tl]]
:[[kd?kd.a:A,"Total assigned"],[kd?kd.c:C,"Completed"],[kd?kd.o:O,"Currently open"],[pc,"Completion rate"],[top,tl]];
if(emp==="All"&&kp[kp.length-1][0]!=="–")kp[kp.length-1][0]="🏆 "+kp[kp.length-1][0];
const KC={"Delivered":"var(--grn)","Completed":"var(--grn)","Awaiting delivery":"var(--blue)"};
$("kp").innerHTML=kp.map(x=>`<div class="card k"><b${KC[x[1]]?` style="color:${KC[x[1]]}"`:""}>${x[0]}</b><span>${x[1]}</span></div>`).join("");
const mx=Math.max(...R.map(x=>x.a||0),1),byA=[...R].sort((a,b)=>b.a-a.a),w=tab==="warranty";let more="";
if(cum){$("t1").textContent="Overall score (each tracker counts 33.3%)";$("c1").innerHTML=[...R].sort((a,b)=>b.s-a.s).map(x=>`<div class="br"><span>${nm(x.n)}</span><div class="bw"><div class="trk"><i data-tip="${x.n} · Overall score ${x.s}%" style="width:${x.s}%;background:var(--blue)"></i></div></div><em>${x.s}%</em></div>`).join("");$("l1").innerHTML="";
const TR=[["w","Warranty","var(--blue)","%"],["p","Pending stock","var(--or)","%"],["st","Stock checking","var(--grn)","%"]];
$("t2").textContent="Score by tracker";$("c2").innerHTML=grp(R,TR,100);$("l2").innerHTML="";
const CS=[["Warranty","var(--blue)"],["Pending stock","var(--or)"],["Stock checking","var(--grn)"]];
more=card("What builds the overall score (33.3% from each tracker)",stk([...R].sort((a,b)=>b.s-a.s),x=>[[x.w/3,CS[0][1],"Warranty (33.3%)"],[x.p/3,CS[1][1],"Pending stock (33.3%)"],[x.st/3,CS[2][1],"Stock checking (33.3%)"]],100,x=>x.s+"%"),lg(CS.map(c=>[c[0]+" (33.3%)",c[1]])))}
else{$("t1").textContent=w?"Delivered vs open":"Completed vs pending";
$("c1").innerHTML=byA.map(x=>`<div class="br"><span>${nm(x.n)}</span><div class="bw"><div class="bar" style="width:${x.a/mx*100}%"><i data-l="${w?"Delivered":"Completed"}" data-tip="${x.n} · ${w?"Delivered":"Completed"}: ${x.c} of ${x.a} (${x.a?r1(x.c/x.a*100):0}%)" style="flex:${x.c};background:var(--grn)"></i><i data-l="${w?"Open":"Pending"}" data-tip="${x.n} · ${w?"Open":"Pending"}: ${x.o} of ${x.a} (${x.a?r1(x.o/x.a*100):0}%)" style="flex:${x.o};background:var(--or)"></i></div></div><em>${x.c}/${x.a}</em></div>`).join("");
$("l1").innerHTML=lg([[w?"Delivered":"Completed","var(--grn)"],[w?"Open":"Pending","var(--or)"]]);
if(w){$("t2").textContent="Machine status";$("c2").innerHTML=pie(ST.map((q,i)=>({l:q[0],c:q[1],v:R.reduce((a,x)=>a+x.st[i],0)})),"machines");$("l2").innerHTML=""}
else{$("t2").textContent="Completion rate";$("c2").innerHTML=byA.map(x=>`<div class="br"><span>${nm(x.n)}</span><div class="bw"><div class="trk"><i data-tip="${x.n} · ${x.c} of ${x.a} (${x.r}%)" style="width:${x.r}%;background:var(--blue)"></i></div></div><em>${x.r}%</em></div>`).join("");$("l2").innerHTML=""}
const wl=[...R].sort((a,b)=>b.s-a.s);
more=card("Share of workload (assigned)",pie(R.map(x=>({l:x.n,c:col[x.n],v:x.a})),w?"machines":"assigned"));
if(w){more+=card("Speed · closing vs pending days",grp(R,[["avg","Avg closing","var(--grn)"," d"],["pd","Avg pending","var(--or)"," d"]],Math.max(...R.map(x=>Math.max(x.avg,x.pd)),1)))}
else if(tab==="pending"){more+=card("Avg closing days (lower is better)",grp(R,[["avg","Avg closing","var(--grn)"," d"]],Math.max(...R.map(x=>x.avg),1)))}
else{more+=card("Score ranking",wl.map(x=>`<div class="br"><span>${nm(x.n)}</span><div class="bw"><div class="trk"><i data-tip="${x.n} · Score ${x.s}%" style="width:${x.s}%;background:var(--blue)"></i></div></div><em>${x.s}%</em></div>`).join(""))
+card("Completed vs pending (units)",grp(R,[["c","Completed","var(--grn)",""],["o","Pending","var(--or)",""]],mx))}}
$("more").innerHTML=more;
